name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: indexlens
          POSTGRES_PASSWORD: indexlens_ci
          POSTGRES_DB: indexlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indexlens -d indexlens"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OPENAI_API_KEY: ""
      INDEXLENS_TEST_DATABASE_URL: postgresql+psycopg://indexlens:indexlens_ci@127.0.0.1:5432/indexlens
      MYPYPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements.lock setuptools wheel
      - run: python -m pip install --no-build-isolation -c requirements.lock -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check src/indexlens tests migrations scripts
      - run: python -m mypy --explicit-package-bases src/indexlens tests migrations scripts
      - run: python -m pytest -q
  containers:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: indexlens-ci
      INDEXLENS_DB_PORT: "55433"
      INDEXLENS_API_PORT: "18000"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api
      - run: docker compose up -d --wait db
      - run: docker compose run --rm migrate
      - run: docker compose run --rm --no-deps api python scripts/sample.py
      - run: docker compose up -d --wait api
      - run: python scripts/smoke.py --base-url http://127.0.0.1:18000
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
