name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: indexlens
          POSTGRES_PASSWORD: indexlens_ci
          POSTGRES_DB: indexlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indexlens -d indexlens"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      INDEXLENS_TEST_DATABASE_URL: postgresql+psycopg://indexlens:indexlens_ci@127.0.0.1:5432/indexlens
      MYPYPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src/indexlens/data_audit.py src/indexlens/membership.py src/indexlens/db src/indexlens/prices src/indexlens/features tests migrations
      - run: python -m mypy --explicit-package-bases src/indexlens/data_audit.py src/indexlens/membership.py src/indexlens/db src/indexlens/prices src/indexlens/features tests migrations
      - run: python -m pytest -q
