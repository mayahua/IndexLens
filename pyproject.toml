[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "indexlens"
version = "0.1.0"
description = "A market data pipeline and index analytics engine."
requires-python = ">=3.12"

dependencies = [
    "openai>=2.54,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "numpy",
    "scikit-learn>=1.7,<1.8",
    "pandas",
    "requests",
    "yfinance==1.7.0",
    "exchange-calendars>=4.11,<5",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv",
]


[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "httpx2>=2.16,<3",
    "mypy",
    "pandas-stubs",
    "pytest",
    "ruff",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
target-version = "py312"
line-length = 88


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]


[tool.mypy]
python_version = "3.12"
strict = true


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "tests",
]

markers = ["postgres: requires INDEXLENS_TEST_DATABASE_URL and PostgreSQL"]
