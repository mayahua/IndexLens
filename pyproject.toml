[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "indexlens"
version = "0.1.0"
description = "A market data pipeline and index analytics engine."
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "requests",
    "sqlalchemy",
    "python-dotenv",
]


[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
target-version = "py312"
line-length = 88


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]


[tool.mypy]
python_version = "3.12"
strict = true


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "tests",
]
